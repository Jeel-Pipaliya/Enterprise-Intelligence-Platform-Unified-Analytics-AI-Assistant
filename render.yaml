services:
  # Backend - FastAPI
  - type: web
    name: enterprise-intelligence-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        value: postgresql://USER:PASSWORD@HOST:6543/postgres?sslmode=require

      - key: SUPABASE_URL
        value: https://your-project.supabase.co

      - key: SUPABASE_ANON_KEY
        value: your_supabase_anon_key

      - key: SUPABASE_SERVICE_ROLE_KEY
        value: your_supabase_service_role_key

      - key: SECRET_KEY
        generateValue: true

      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"

      - key: OPENROUTER_API_KEY
        value: your_openrouter_api_key

      - key: OPENROUTER_MODEL
        value: google/gemma-4-26b-a4b-it

      - key: OPENROUTER_MAX_TOKENS
        value: "900"

      - key: OPENROUTER_SITE_URL
        value: https://your-vercel-app.vercel.app

      - key: OPENROUTER_APP_TITLE
        value: Enterprise Intelligence Platform

      - key: CORS_ORIGINS
        value: https://your-vercel-app.vercel.app

      - key: LLM_API_KEY
        value: your_legacy_llm_key_if_needed

  # Frontend - React/Vite
  - type: web
    name: enterprise-intelligence-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: true
    envVars:
      - key: VITE_API_URL
        value: https://your-render-backend-url

      - key: NEXT_PUBLIC_SUPABASE_URL
        value: https://your-project.supabase.co

      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        value: your_supabase_anon_key

      - key: NEXT_PUBLIC_API_URL
        value: https://your-render-backend-url